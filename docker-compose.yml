# Local dev environment — PHP 8.4 (Laravel 13) + PostgreSQL 16 + Redis 7.
# Infra hostnames/creds are injected as container env vars below; Laravel's
# env() reads them and they OVERRIDE the .env file — so the same .env works on
# the host and in Docker. Core services start with `docker compose up -d`;
# optional ones live behind profiles. See docs/local-development.md.

# Shared app env (overrides .env inside containers). Single source of truth.
x-app-env: &app-env
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: cho_rach
  # Runtime role — non-superuser, RLS-enforced (see docs/local-development.md).
  DB_USERNAME: cho_rach_app
  DB_PASSWORD: secret
  # Privileged owner role — migrations / DDL / audit / cross-workspace reads.
  DB_PRIVILEGED_USERNAME: cho_rach_owner
  DB_PRIVILEGED_PASSWORD: secret
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: cho-rach
  REVERB_APP_KEY: local-reverb-key
  REVERB_APP_SECRET: local-reverb-secret
  REVERB_HOST: localhost
  REVERB_PORT: 8081
  REVERB_SCHEME: http
  VITE_DEV_SERVER_URL: http://localhost:5173

# Shared definition for every PHP service (app / horizon / reverb).
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  environment: *app-env
  volumes:
    - .:/var/www/html
    # vendor/ lives on a Linux named volume, NOT the Windows bind mount. Booting
    # Laravel reads thousands of vendor class files per request; over the slow
    # Docker Desktop bind mount that costs ~15s/request. On a native volume it's
    # instant. App code stays on the bind mount, so PHP edits are still live.
    # Populated by the entrypoint's `composer install` on first boot.
    - vendor:/var/www/html/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *php
    expose:
      - "9000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cho_rach
      POSTGRES_USER: cho_rach_owner          # privileged owner role (matches host design)
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot bootstrap: create the cho_rach_app runtime role + cho_rach_test
      # DB + grants. Runs only on an empty data dir (down -v to re-run).
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/sql/setup-roles.sql:/opt/db/setup-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cho_rach_owner -d cho_rach"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Vite dev server (frontend). Enable: docker compose --profile frontend up node
  node:
    image: node:22-alpine
    working_dir: /var/www/html
    environment:
      <<: *app-env
      # Windows bind mounts don't emit inotify events — force Vite to poll so HMR
      # picks up edits made on the host. See vite.config.js server.watch.
      VITE_USE_POLLING: "true"
    volumes:
      - .:/var/www/html
      # node_modules + pnpm store live on a Linux named volume, NOT the Windows
      # bind mount — pnpm's content-addressable store needs same-fs links, which
      # the bind mount can't do (ERR_PNPM system error -116). Also much faster.
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "corepack enable &&
             pnpm config set store-dir /var/www/html/node_modules/.pnpm-store &&
             pnpm install &&
             pnpm run dev"
    profiles: ["frontend"]

  # Queue worker. Enable: docker compose --profile workers up -d horizon
  horizon:
    <<: *php
    command: php artisan horizon
    profiles: ["workers"]

  # Reverb WebSocket (live chat). Enable: docker compose --profile workers up -d reverb
  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    profiles: ["workers"]

volumes:
  pgdata:
  node_modules:
  vendor:
